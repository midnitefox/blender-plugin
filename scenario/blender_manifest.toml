schema_version = "1.0.0"

# Independent fork identity; keeps installed state separate from upstream.
id = "open_studio"
version = "0.11.0"
name = "Open Studio"
tagline = "Create with your connected assistant and local Blender tools"
maintainer = "midnitefox"
type = "add-on"
website = "https://github.com/midnitefox/blender-plugin"
tags = ["3D View", "Material", "Import-Export"]
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Scenario Inc."]

# Pinned in sdk-wheel-lock.json; staged by tools/wheel_bundle.py.
platforms = ["linux-x64", "windows-x64", "macos-arm64", "macos-x64"]
wheels = [
  "./wheels/annotated_types-0.8.0-py3-none-any.whl",
  "./wheels/anyio-4.15.1-py3-none-any.whl",
  "./wheels/certifi-2026.7.22-py3-none-any.whl",
  "./wheels/distro-1.9.0-py3-none-any.whl",
  "./wheels/h11-0.16.0-py3-none-any.whl",
  "./wheels/httpcore-1.0.9-py3-none-any.whl",
  "./wheels/httpx-0.28.1-py3-none-any.whl",
  "./wheels/idna-3.19-py3-none-any.whl",
  "./wheels/pydantic-2.13.5-py3-none-any.whl",
  "./wheels/pydantic_core-2.46.5-cp311-cp311-macosx_10_12_x86_64.whl",
  "./wheels/pydantic_core-2.46.5-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pydantic_core-2.46.5-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/pydantic_core-2.46.5-cp311-cp311-win_amd64.whl",
  "./wheels/pydantic_core-2.46.5-cp313-cp313-macosx_10_12_x86_64.whl",
  "./wheels/pydantic_core-2.46.5-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pydantic_core-2.46.5-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/pydantic_core-2.46.5-cp313-cp313-win_amd64.whl",
  "./wheels/scenario_sdk-2.2.0-py3-none-any.whl",
  "./wheels/sniffio-1.3.1-py3-none-any.whl",
  "./wheels/typing_extensions-4.16.0-py3-none-any.whl",
  "./wheels/typing_inspection-0.4.4-py3-none-any.whl",
]

[permissions]
network = "Connect local assistants on 127.0.0.1"
files = "Read assistant images and save local project output"
clipboard = "Copy setup instructions for your assistant"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  ".DS_Store",
]
